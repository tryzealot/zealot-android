name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37 build-tools;37.0.0'

      - name: Assemble library and sample
        run: ./gradlew :zealot:assembleDebug :app:assembleDebug :zealot:assembleRelease :app:assembleRelease

      - name: Run Android lint
        run: ./gradlew :zealot:lint :app:lint

      - name: Run library unit tests
        run: ./gradlew :zealot:testDebugUnitTest

      - name: Verify Maven publication
        run: ./gradlew :zealot:publishToMavenLocal
