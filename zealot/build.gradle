plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def versionProperties = new Properties()
rootProject.file('version.properties').withInputStream { versionProperties.load(it) }
def sdkVersion = versionProperties.getProperty('sdkVersion')
def jitpackGroup = System.getenv('GROUP')
def repositoryOwner = jitpackGroup?.startsWith('com.github.')
    ? jitpackGroup.substring('com.github.'.length())
    : 'tryzealot'
def repositoryUrl = "https://github.com/${repositoryOwner}/zealot-android"

group = jitpackGroup ? "${jitpackGroup}.zealot-android" : 'im.ews.zealot'
version = System.getenv('VERSION') ?: sdkVersion

android {
    namespace = 'im.ews.zealot'
    compileSdk = 37

    defaultConfig {
        minSdk = 21
        versionCode = 1
        versionName = "1.0"

        consumerProguardFiles('consumer-rules.pro')
        buildConfigField('String', 'ZEALOT_SDK_VERSION', "\"${sdkVersion}\"")
    }

    lint {
        abortOnError = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

}

dependencies {
    api 'com.squareup.okhttp3:okhttp:5.5.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
}

tasks.withType(Test).configureEach {
    // Robolectric reflects into FileDescriptor on recent Android SDKs.
    jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'

    def liveApiConfigured = System.getenv('ZEALOT_TEST_ENDPOINT')?.isBlank() == false &&
        System.getenv('ZEALOT_TEST_CHANNEL_KEY')?.isBlank() == false
    // Track only presence: channel keys must not become cache inputs or build-scan values.
    inputs.property('liveApiConfigured', liveApiConfigured)
    outputs.upToDateWhen { !liveApiConfigured }
    outputs.doNotCacheIf('The live API depends on mutable external server data') { liveApiConfigured }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = 'zealot'
            version = project.version
            pom {
                name = 'Zealot Android SDK'
                description = 'Android client for checking and presenting Zealot channel updates.'
                url = repositoryUrl
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    connection = "scm:git:${repositoryUrl}.git"
                    url = repositoryUrl
                }
            }
            afterEvaluate {
                from components.release
            }
        }
    }
}
