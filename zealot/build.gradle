plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def sdkVersion = '0.3.0'
def jitpackGroup = System.getenv('GROUP')

group = jitpackGroup ? "${jitpackGroup}.zealot-android" : 'im.ews.zealot'
version = System.getenv('VERSION') ?: sdkVersion

android {
    namespace = 'im.ews.zealot'
    compileSdk = 37

    defaultConfig {
        minSdk = 21
        versionCode = 1
        versionName = "1.0"

        consumerProguardFiles('consumer-rules.pro')
        buildConfigField('String', 'ZEALOT_SDK_VERSION', "\"${sdkVersion}\"")
    }

    lint {
        abortOnError = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

}

dependencies {
    api 'com.squareup.okhttp3:okhttp:5.5.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
}

tasks.withType(Test).configureEach {
    // Robolectric reflects into FileDescriptor on recent Android SDKs.
    jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = 'zealot'
            version = project.version
            afterEvaluate {
                from components.release
            }
        }
    }
}
